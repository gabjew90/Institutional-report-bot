<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Market Pulse</title>
  <meta name="description" content="Cross-bank synthesis of institutional research, delivered every weekday at 9 AM ET.">

  <!-- Site chrome styles (page-level: masthead, layout, footer). -->
  <link rel="stylesheet" href="style.css">
  <!-- Fragment styles (only target classes inside <article class="pulse">).
       The pulse content is fetched at runtime from the pulse-data branch
       and injected; this stylesheet handles the visual identity of the
       embedded content. Edit pulse.css to change how the pulse looks; edit
       style.css to change the site chrome. The two files are intentionally
       separate so the pulse can be re-themed without touching the site. -->
  <link rel="stylesheet" href="pulse.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <p class="site-brand">Your brand here</p>
    <nav class="site-nav">
      <a href="#pulse">Today</a>
      <a href="#archive">Archive</a>
    </nav>
  </div>
</header>

<main class="site-main">

  <!-- =========================================================
       THE PULSE PANE — single section, gets the fetched fragment
       injected by the script at the bottom. This is the "pane on
       your website" that updates every weekday at 9 AM ET.
       ========================================================= -->
  <section id="pulse" class="pulse-pane">
    <div class="pulse-pane__loader">Loading the latest pulse&hellip;</div>
  </section>

  <!-- =========================================================
       ARCHIVE — last N pulses, rendered from archive.json. The
       worker keeps this index updated automatically. Each link
       opens the raw markdown on GitHub; you can also wire each
       entry to fetch its own fragment if you want a multi-page
       archive view later.
       ========================================================= -->
  <aside id="archive" class="archive">
    <h2 class="archive__title">Past pulses</h2>
    <ul class="archive__list" id="archive-list">
      <li class="archive__loader">Loading archive&hellip;</li>
    </ul>
  </aside>

</main>

<footer class="site-footer">
  <p>
    Synthesized from 100&ndash;200 institutional research PDFs daily.
    Not investment advice.
  </p>
</footer>

<script>
  // =================================================================
  // CONFIG — point these at the bridge branch where the pipeline
  // commits its web/ artifacts. raw.githack.com proxies GitHub raw
  // with the correct content-type and CDN caching; use it instead of
  // raw.githubusercontent.com for production embeds.
  // =================================================================
  const REPO = 'gabjew90/Institutional-report-bot';
  const BRANCH = 'pulse-data';
  const FRAGMENT_URL = `https://raw.githack.com/${REPO}/${BRANCH}/pulse-output/web/latest-fragment.html`;
  const METADATA_URL = `https://raw.githack.com/${REPO}/${BRANCH}/pulse-output/web/latest.json`;
  const ARCHIVE_URL  = `https://raw.githack.com/${REPO}/${BRANCH}/pulse-output/web/archive.json`;

  // =================================================================
  // RENDER THE PULSE PANE
  // =================================================================
  async function loadPulse() {
    const pane = document.querySelector('#pulse');
    try {
      const resp = await fetch(FRAGMENT_URL, { cache: 'no-store' });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const html = await resp.text();
      // Inject the fragment. The fetched HTML is plain markup (no
      // <script>, no event handlers) — we're rendering our own pipeline's
      // output, so .innerHTML is safe here. If you ever embed third-party
      // HTML, sanitize first.
      pane.innerHTML = html;
    } catch (err) {
      pane.innerHTML = `
        <div class="pulse-pane__error">
          <p>Couldn't load today's pulse.</p>
          <p><small>${err.message}</small></p>
        </div>`;
    }
  }

  // =================================================================
  // RENDER THE ARCHIVE LIST
  // =================================================================
  async function loadArchive() {
    const list = document.querySelector('#archive-list');
    try {
      const resp = await fetch(ARCHIVE_URL, { cache: 'no-store' });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      const items = (data.pulses || []).slice(0, 14);  // last 14
      if (!items.length) {
        list.innerHTML = '<li class="archive__empty">No archived pulses yet.</li>';
        return;
      }
      list.innerHTML = items.map(p => {
        const display = (p.ts || '').replace('T', ' ').replace(/-/g, '/').slice(0, 16) + ' UTC';
        return `<li><a href="${p.archive_url}">${display}</a></li>`;
      }).join('');
    } catch (err) {
      list.innerHTML = `<li class="archive__empty">Archive unavailable.</li>`;
    }
  }

  loadPulse();
  loadArchive();
</script>

</body>
</html>
