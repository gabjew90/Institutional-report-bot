# Python is PINNED. Nixpacks auto-detects otherwise, and a base
# image update could move the runtime under us -- which is
# divergence 9 in NOTES.md, the one that crash-looped the bot.
# .python-version carries the same pin for local tooling.
[variables]
NIXPACKS_PYTHON_VERSION = "3.12"

[phases.setup]
aptPkgs = ["poppler-utils"]
# nixLibs add to LD_LIBRARY_PATH at runtime. stdenv.cc.cc.lib provides
# libstdc++.so.6 — required by numpy's C extensions (numpy is a yfinance
# transitive dep, used by the /ask lookup_options_chain tool). Without
# this, `import numpy` raises 'libstdc++.so.6: cannot open shared object
# file' on Railway's Nix-based image and yfinance fails to import.
nixLibs = ["stdenv.cc.cc.lib"]
