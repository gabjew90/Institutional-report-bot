# Grader separation gate (plan 4.2) — dispatch-only.
#
# Runs every grader prompt on its seeded known-bad artifact and the
# clean counterpart. Every dimension must FAIL the bad one and PASS the
# clean one; a grader that passes both is TOO WEAK. Day 1 does not
# start until this is green, and it re-runs after any grader-prompt
# change. The verdict is committed to pilot-data under grader-gate/.
name: pilot-grader-gate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pilot-grader-gate
  cancel-in-progress: false

env:
  PILOT_ROOT: pilot

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout pilot-data
        uses: actions/checkout@v4
        with:
          ref: pilot-data
          path: pilot-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build fixture inputs
        run: python scripts/pilot_grader_gate.py --build /tmp/gate/in

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run every grader on bad and clean
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -u
          MODEL=$(python -c "from scripts.pilot_config import MODEL_GRADER;print(MODEL_GRADER)")
          P=docs/superpowers/routines/pilot/graders
          mkdir -p /tmp/gate/grades
          for DIM in grouping fidelity brief_fidelity mechanism; do
            for CASE in bad clean; do
              { cat "$P/$DIM.md"; printf '\n\n---\n\n'; cat "/tmp/gate/in/$DIM-$CASE.md"; } > /tmp/gate/prompt.txt
              claude -p --model "$MODEL" \
                --permission-mode bypassPermissions --max-turns 20 \
                < /tmp/gate/prompt.txt > /tmp/gate/raw.txt 2>/dev/null || true
              python scripts/pilot_finalize_grade.py --raw /tmp/gate/raw.txt \
                --out "/tmp/gate/grades/$DIM-$CASE.json" --dim "$DIM" --agent a \
                --model "$MODEL" --prompt "$P/$DIM.md" --artifact fixture || true
            done
          done

      - name: Judge separation
        id: judge
        run: |
          set +e
          # Without pipefail $? is tee's status and the gate can never fail.
          set -o pipefail
          python scripts/pilot_grader_gate.py --judge /tmp/gate/grades | tee /tmp/gate/judge.txt
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Record the verdict on pilot-data
        working-directory: pilot-data
        run: |
          TS=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          mkdir -p "$PILOT_ROOT/grader-gate/$TS"
          cp /tmp/gate/grades/*.json "$PILOT_ROOT/grader-gate/$TS/"
          cp /tmp/gate/judge.txt "$PILOT_ROOT/grader-gate/$TS/judge.txt"
          git config user.name "pilot-gate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$PILOT_ROOT/grader-gate/"
          git commit -m "pilot: grader gate $TS" || true
          git pull --rebase --quiet origin pilot-data || true
          git push origin pilot-data || true

      - name: Fail the run unless every dimension separates
        run: |
          if [ "${{ steps.judge.outputs.rc }}" != "0" ]; then
            echo "::error::grader gate NOT cleared — see judge output above"; exit 1
          fi
