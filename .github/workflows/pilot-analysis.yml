# Claude analysis lane (spec docs/superpowers/specs/2026-10-06-retire-gemini-
# pdf-pipeline-design.md, phase 1). For every HIGH document the pilot
# publishes, run the production deep-analysis prompt through Claude and
# commit a complete pdf_analyses-shaped record to pilot/analyses/. Runs
# beside the frozen pilot readers (own concurrency group, own paths);
# the worker dispatches it (github_bridge/workflow_dispatch.py).
# Production reads nothing from it until the cutover switch.
name: pilot-analysis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pilot-analysis
  cancel-in-progress: false

env:
  PILOT_ROOT: pilot
  PILOT_BRANCH: pilot-data

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout pilot-data
        uses: actions/checkout@v4
        with:
          ref: pilot-data
          path: pilot-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find documents without an analysis
        id: pending
        run: |
          python scripts/pilot_analyze.py pending --root "pilot-data/$PILOT_ROOT" \
            --days 7 --limit 25 > /tmp/pending.tsv
          N=$(grep -c . /tmp/pending.tsv || true)
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "pending: $N"

      - name: Install Claude Code
        if: steps.pending.outputs.count != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Auth check
        if: steps.pending.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          out=$(claude -p "reply with exactly: ok" --model haiku --max-turns 1 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ] || ! printf '%s' "$out" | grep -qi "ok"; then
            if printf '%s' "$out" | grep -qiE "hit your .*limit|usage limit|rate limit"; then
              echo "::error::Claude usage limit reached; the token is fine. $(printf '%s' "$out" | grep -iE 'limit' | head -1)"
            else
              echo "::error::Claude auth failed (exit $rc), re-mint CLAUDE_CODE_OAUTH_TOKEN."
            fi
            printf '%s\n' "$out" | tail -5
            exit 1
          fi

      - name: Analyze each document
        if: steps.pending.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -u
          git -C pilot-data config user.name  'pilot-analysis-bot'
          git -C pilot-data config user.email 'actions@users.noreply.github.com'
          persist () {
            git -C pilot-data add "$PILOT_ROOT/analyses/" "$PILOT_ROOT/analysis-failures/" 2>/dev/null || true
            if git -C pilot-data diff --cached --quiet; then return 0; fi
            git -C pilot-data commit -q -m "pilot: analysis ($1)" || return 0
            for attempt in 1 2 3; do
              git -C pilot-data pull --rebase --quiet origin pilot-data || true
              if git -C pilot-data push -q origin pilot-data; then return 0; fi
              sleep 3
            done
            echo "::warning::could not push after $1; the next run retries"
          }
          MODEL=$(python -c "import sys;sys.path.insert(0,'scripts');import pilot_analyze;print(pilot_analyze.MODEL)")
          TOTAL=0; FAILED=0
          while IFS=$'\t' read -r ID TEXT META DATE; do
            [ -z "${ID:-}" ] && continue
            TOTAL=$((TOTAL+1))
            OUT="pilot-data/$PILOT_ROOT/analyses/$DATE/$ID.json"
            python scripts/pilot_analyze.py prompt --text "$TEXT" --meta "$META" --out /tmp/analysis_prompt.txt
            claude -p --model "$MODEL" --permission-mode bypassPermissions --max-turns 3 \
              --output-format json \
              < /tmp/analysis_prompt.txt > /tmp/analysis_out.txt 2>/tmp/analysis_err.txt || true
            # A usage or rate limit is not this document's fault: it must not
            # use up an attempt, and the rest of the run would hit it too.
            if python scripts/pilot_analyze.py limit --raw /tmp/analysis_out.txt; then
              echo "::warning::Claude usage limit reached; stopping this run, nothing counted as failed"
              break
            fi
            if ! python scripts/pilot_analyze.py finalize --raw /tmp/analysis_out.txt \
                --text "$TEXT" --meta "$META" --out "$OUT" --model "$MODEL"; then
              echo "::warning::analysis failed for $ID"
              echo "stdout head:"; head -c 300 /tmp/analysis_out.txt || true; echo
              python scripts/pilot_analyze.py fail --root "pilot-data/$PILOT_ROOT" --date "$DATE" \
                --id "$ID" --reason "$(head -c 120 /tmp/analysis_out.txt | tr '\n' ' ')" || true
              FAILED=$((FAILED+1))
            fi
            persist "$ID"
          done < /tmp/pending.tsv
          echo "analyzed $TOTAL document(s), $FAILED failed"
          if [ "$TOTAL" -gt 0 ] && [ "$FAILED" -eq "$TOTAL" ]; then
            echo "::error::every analysis failed this run"; exit 1
          fi
