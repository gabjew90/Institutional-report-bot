# Claude analysis lane (spec docs/superpowers/specs/2026-10-06-retire-gemini-
# pdf-pipeline-design.md, phases 1 and 2). For every HIGH or MEDIUM document
# the worker is waiting for (pilot/lane/waiting.json on pilot-data, written by
# github_bridge/claude_lane.py), run the production deep-analysis prompt
# through Claude and commit a complete pdf_analyses-shaped record to
# pilot/analyses/. The worker loads the record, or runs Gemini when none
# arrives before the deadline in the list.
#
# The worker starts a run when its list is not empty. A run works several
# documents at a time for up to 25 minutes and re-reads the list between
# documents. The worker starts the next one while notes are still waiting.
#
# Beside the frozen pilot readers: own concurrency group, own paths.
name: pilot-analysis

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Speed test: analyse this many recent HIGH notes and commit nothing (0 = a normal run)"
        required: false
        default: "0"
      workers:
        description: "Documents analysed at the same time"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: pilot-analysis
  cancel-in-progress: false

env:
  PILOT_ROOT: pilot
  PILOT_BRANCH: pilot-data
  # each document's line is printed as it finishes, not when the run ends
  PYTHONUNBUFFERED: "1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout pilot-data
        uses: actions/checkout@v4
        with:
          ref: pilot-data
          path: pilot-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find documents the worker is waiting for
        id: pending
        env:
          DRY: ${{ inputs.dry_run || '0' }}
        run: |
          if [ "$DRY" != "0" ]; then
            N="$DRY"
          else
            N=$(python scripts/pilot_analyze.py pending --root "pilot-data/$PILOT_ROOT" \
              --limit 1000 | grep -c . || true)
          fi
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "waiting: $N"

      - name: Install Claude Code
        if: steps.pending.outputs.count != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Auth check
        if: steps.pending.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          out=$(claude -p "reply with exactly: ok" --model haiku --max-turns 1 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ] || ! printf '%s' "$out" | grep -qi "ok"; then
            if printf '%s' "$out" | grep -qiE "hit your .*limit|usage limit|rate limit"; then
              echo "::error::Claude usage limit reached; the token is fine. $(printf '%s' "$out" | grep -iE 'limit' | head -1)"
            else
              echo "::error::Claude auth failed (exit $rc), re-mint CLAUDE_CODE_OAUTH_TOKEN."
            fi
            printf '%s\n' "$out" | tail -5
            exit 1
          fi

      - name: Analyze
        if: steps.pending.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DRY: ${{ inputs.dry_run || '0' }}
          WORKERS: ${{ inputs.workers || '4' }}
        run: |
          set -u
          git -C pilot-data config user.name  'pilot-analysis-bot'
          git -C pilot-data config user.email 'actions@users.noreply.github.com'
          python scripts/pilot_analyze.py run --root "pilot-data/$PILOT_ROOT" --repo pilot-data \
            --workers "$WORKERS" --budget-minutes 25 --dry-run "$DRY"
