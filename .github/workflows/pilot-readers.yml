# Shadow-pilot readers — one agent per unread HIGH document.
#
# Emits the two-part artifact (document brief + verified claim cards)
# per spec section 2, on the upload-weighted cadence of section 2.1:
# dense through the 5-10 AM ET research window, sparse overnight, so
# the morning catch-up read stays genuinely marginal.
#
# Model strings are PINNED via scripts/pilot_config.py (plan 3.7) and
# a change to them restarts the pilot clock. Provenance (requested
# model, returned version, prompt hash) rides in every cards file.
#
# Artifacts live on the pilot-data ORPHAN branch (owner call
# 2026-09-01, option B) — production data is on pulse-data and this
# job never touches it.
name: pilot-readers

on:
  schedule:
    # Dense window: hourly 09-14 UTC (~5-10 AM ET) plus a 13:15 run
    # (~9:15 AM ET) to catch the pre-pulse stack.
    - cron: "0 9-14 * * 1-5"
    - cron: "15 13 * * 1-5"
    # Sparse overnight / weekend: every 4h.
    - cron: "0 1,5,17,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pilot-readers
  cancel-in-progress: false

env:
  PILOT_ROOT: pilot
  PILOT_BRANCH: pilot-data

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout pilot-data
        uses: actions/checkout@v4
        with:
          ref: pilot-data
          path: pilot-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find unread documents
        id: unread
        run: |
          # Unread = a source-text file with no matching cards file.
          # Skip-fast keeps the ~10 daily runs near a minute each when
          # nothing landed.
          python scripts/pilot_list_unread.py \
            --root "pilot-data/$PILOT_ROOT" --out /tmp/unread.json
          N=$(python -c "import json;print(len(json.load(open('/tmp/unread.json'))))")
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "unread: $N"

      - name: Install Claude Code
        if: steps.unread.outputs.count != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Auth check
        if: steps.unread.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          out=$(claude -p "reply with exactly: ok" --model haiku \
              --max-turns 1 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ] || ! printf '%s' "$out" | grep -qi "ok"; then
            echo "::error::Claude auth failed (exit $rc) — re-mint with \
          'claude setup-token' and update CLAUDE_CODE_OAUTH_TOKEN."
            printf '%s\n' "$out" | tail -5
            exit 1
          fi

      - name: Read each document
        if: steps.unread.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -u
          # Persist after EVERY document. Every readers run on 2026-09-03
          # was killed by `timeout-minutes: 45` partway through this loop
          # and the commit step (which ran after it) was skipped, so 20
          # runs threw away every card they had verified and the backlog
          # only grew. A kill now costs the document in flight, not the run.
          git -C pilot-data config user.name  'pilot-reader-bot'
          git -C pilot-data config user.email 'actions@users.noreply.github.com'
          persist () {  # $1 = commit message suffix
            git -C pilot-data add "$PILOT_ROOT/cards/" "$PILOT_ROOT/ops/" 2>/dev/null || true
            if git -C pilot-data diff --cached --quiet; then return 0; fi
            git -C pilot-data commit -q -m "pilot: reader cards ($1)" || return 0
            for attempt in 1 2 3; do
              git -C pilot-data pull --rebase --quiet origin pilot-data || true
              if git -C pilot-data push -q origin pilot-data; then return 0; fi
              sleep 3
            done
            echo "::warning::could not push after $1; the next run retries"
          }
          # TSV, read line-by-line: a `for` over command substitution
          # word-splits, and document slugs are not guaranteed
          # space-free.
          python - <<'PY' > /tmp/unread.tsv
          import json
          for d in json.load(open("/tmp/unread.json")):
              print("\t".join([d["id"], d["text_path"], d["model"],
                               d["tier"], d["date"]]))
          PY
          TOTAL=0; FAILED=0
          while IFS=$'\t' read -r ID TEXT MODEL TIER DATE; do
            [ -z "${ID:-}" ] && continue
            TOTAL=$((TOTAL+1))
            OUT="pilot-data/$PILOT_ROOT/cards/$DATE/$ID.json"
            mkdir -p "$(dirname "$OUT")"

            # Build the prompt in a FILE. Everything here stays
            # indented: a column-0 line would terminate this YAML
            # block scalar.
            {
              cat docs/superpowers/routines/pilot/reader.md
              printf '\n\nSOURCE_TEXT_PATH=%s\n' "$TEXT"
            } > /tmp/reader_prompt.txt

            # Turn budget scales with the document. Shakedown 2026-09-02:
            # a 432 KB JPM strategy deck exhausted 12 turns just reading
            # itself and returned "Reached max turns" instead of JSON;
            # that alone was the day's reader failure rate.
            BYTES=$(wc -c < "$TEXT" 2>/dev/null || echo 0)
            MAXT=12
            [ "$BYTES" -gt 150000 ] && MAXT=20
            [ "$BYTES" -gt 300000 ] && MAXT=30
            claude -p --model "$MODEL" \
              --permission-mode bypassPermissions \
              --max-turns "$MAXT" \
              < /tmp/reader_prompt.txt > /tmp/reader_out.txt 2>/tmp/reader_err.txt || true

            if ! python scripts/pilot_finalize_read.py \
                --raw /tmp/reader_out.txt --out "$OUT" \
                --source "$TEXT" --tier "$TIER" --model "$MODEL" \
                --prompt docs/superpowers/routines/pilot/reader.md; then
              echo "::warning::reader failed for $ID"
              tail -3 /tmp/reader_err.txt || true
              FAILED=$((FAILED+1))
              continue
            fi

            # Pass 1: verify anchors, collect failures for ONE re-ask,
            # in-session per spec section 3 (a deferred re-ask is a
            # card lost for hours).
            # Every step below is per-document: a failure must cost THIS
            # document, not the run. Before 2026-09-03 these ran unguarded
            # under the Actions default `bash -e`, so one bad document
            # aborted the step; because the ops record is written at the end
            # of this same step and the commit is gated on it succeeding,
            # the whole run's cards vanished leaving no trace.
            if ! python scripts/pilot_verify_cards.py "$OUT" "$TEXT" \
              --reask-out /tmp/reask.json; then
              echo "::warning::anchor verify (pass 1) failed for $ID"
              FAILED=$((FAILED+1)); continue
            fi
            NEEDS=$(python -c "import json;print(json.load(open('$OUT'))['verify']['needs_reask'])" 2>/dev/null || echo Error)
            if [ "$NEEDS" = "Error" ]; then
              echo "::warning::could not read the verify block for $ID"
              FAILED=$((FAILED+1)); continue
            fi
            if [ "$NEEDS" = "True" ]; then
              {
                cat /tmp/reader_prompt.txt
                printf '\n[RE-ASK] These cards had anchors NOT found in the source:\n'
                cat /tmp/reask.json
                printf '\nRe-emit the COMPLETE artifact. For each failed card, either copy its anchor character-for-character from the source or omit that card. Change nothing else.\n'
              } > /tmp/reask_prompt.txt
              claude -p --model "$MODEL" \
                --permission-mode bypassPermissions \
                --max-turns "$MAXT" \
                < /tmp/reask_prompt.txt > /tmp/reader_out.txt 2>/dev/null || true
              python scripts/pilot_finalize_read.py \
                --raw /tmp/reader_out.txt --out "$OUT" \
                --source "$TEXT" --tier "$TIER" --model "$MODEL" \
                --prompt docs/superpowers/routines/pilot/reader.md || true
            fi
            # Pass 2: drop whatever still fails, and count the drops.
            if ! python scripts/pilot_verify_cards.py "$OUT" "$TEXT" --final; then
              echo "::warning::anchor verify (final) failed for $ID"
              FAILED=$((FAILED+1)); continue
            fi
            python scripts/pilot_ops_record.py --root "pilot-data/$PILOT_ROOT" \
              --total "$TOTAL" --failed "$FAILED" || true
            persist "$ID"
          done < /tmp/unread.tsv
          echo "read $TOTAL document(s), $FAILED failed"
          # Metric 5 (ops): one entry per run, upserted by run id, so the
          # per-document calls above collapse into a single record.
          python scripts/pilot_ops_record.py --root "pilot-data/$PILOT_ROOT" \
            --total "$TOTAL" --failed "$FAILED" || true
          persist "final $TOTAL doc(s)"
          # One poisoned PDF must not stop the pilot's day; a total
          # wipeout should be loud.
          if [ "$TOTAL" -gt 0 ] && [ "$FAILED" -eq "$TOTAL" ]; then
            echo "::error::every reader failed this run"; exit 1
          fi

      - name: Record a quiet run in ops
        if: steps.unread.outputs.count == '0'
        run: |
          # A run that found nothing still writes its ops entry: both
          # commits used to sit behind the same non-zero gate, so a day
          # the readers produced nothing left no trace to diagnose.
          python scripts/pilot_ops_record.py --root "pilot-data/$PILOT_ROOT" \
            --total 0 --failed 0 --quiet-run

      - name: Commit ops for a quiet run
        if: steps.unread.outputs.count == '0'
        working-directory: pilot-data
        run: |
          git config user.name "pilot-reader-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -d "$PILOT_ROOT/ops" ] && git add "$PILOT_ROOT/ops/"
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "pilot: reader quiet run ($(date -u +%FT%TZ))"
          git pull --rebase --quiet origin pilot-data || true
          git push origin pilot-data

      - name: Commit cards
        if: steps.unread.outputs.count != '0'
        working-directory: pilot-data
        run: |
          git config user.name "pilot-reader-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -d "$PILOT_ROOT/cards" ]; then
            git add "$PILOT_ROOT/cards/"
          fi
          if [ -d "$PILOT_ROOT/ops" ]; then
            git add "$PILOT_ROOT/ops/"
          fi
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "pilot: reader cards ($(date -u +%FT%TZ))"
          # The publish job also pushes here; rebase before push so a
          # concurrent commit is a retry, not a lost run.
          git pull --rebase --quiet origin pilot-data || true
          git push origin pilot-data
