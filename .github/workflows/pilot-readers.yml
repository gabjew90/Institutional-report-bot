# Shadow-pilot readers — one agent per unread HIGH document.
#
# Emits the two-part artifact (document brief + verified claim cards)
# per spec section 2, on the upload-weighted cadence of section 2.1:
# dense through the 5-10 AM ET research window, sparse overnight, so
# the morning catch-up read stays genuinely marginal.
#
# Model strings are PINNED via scripts/pilot_config.py (plan 3.7) and
# a change to them restarts the pilot clock. Provenance (requested
# model, returned version, prompt hash) rides in every cards file.
#
# Artifacts live on the pilot-data ORPHAN branch (owner call
# 2026-09-01, option B) — production data is on pulse-data and this
# job never touches it.
name: pilot-readers

# No `schedule:` block (2026-09-18). The worker dispatches every slot
# this file used to declare: hourly 09-14 UTC plus 13:15 on weekdays,
# and 01/05/17/21 daily (github_bridge/workflow_dispatch.PILOT_WORKFLOWS,
# same times). Keeping GitHub's cron as a "fallback" cost more than it
# bought: cron and dispatch fired the same minute, GitHub holds the
# second run in the concurrency group as `pending` and cancels it, and
# the ops record filled with cancellations that were never failures
# (2026-09-16, four of them). The fallback could not help anyway, since
# a worker that is down publishes no source text for a reader to read.
# The editor's cron was deleted 2026-09-05 for the same reason.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Speed test: read this many already-read notes again and commit nothing (0 = a normal run)"
        required: false
        default: "0"
      workers:
        description: "Documents read at the same time"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: pilot-readers
  cancel-in-progress: false

env:
  PILOT_ROOT: pilot
  PILOT_BRANCH: pilot-data

jobs:
  read:
    runs-on: ubuntu-latest
    # 45 until 2026-09-11. At 6-7 minutes per document a 35-document
    # conference-week backlog killed three consecutive hourly runs at
    # 45:00 (each still persisted its finished documents) and pushed
    # reads past the 13:55 editor, voiding the day. The concurrency
    # group serialises runs, so a long run delays the next slot rather
    # than overlapping it.
    # 2026-11-25: the run stops handing out documents after 75 minutes
    # (scripts/pilot_read.py), so the limit below is a backstop for a reader
    # that hangs, not the way a run normally ends. Four runs that day were
    # cancelled at 90:00 with documents in flight.
    timeout-minutes: 100
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout pilot-data
        uses: actions/checkout@v4
        with:
          ref: pilot-data
          path: pilot-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find unread documents
        id: unread
        env:
          DRY: ${{ inputs.dry_run || '0' }}
        run: |
          # Unread = a source-text file with no matching cards file.
          # Skip-fast keeps the ~10 daily runs near a minute each when
          # nothing landed.
          python scripts/pilot_list_unread.py \
            --root "pilot-data/$PILOT_ROOT" --out /tmp/unread.json
          N=$(python -c "import json;print(len(json.load(open('/tmp/unread.json'))))")
          if [ "$DRY" != "0" ]; then N="$DRY"; fi
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "unread: $N"

      - name: Install Claude Code
        if: steps.unread.outputs.count != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Auth check
        if: steps.unread.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          out=$(cd "$RUNNER_TEMP" && claude -p "reply with exactly: ok" --model haiku \
              --tools "" --max-turns 1 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ] || ! printf '%s' "$out" | grep -qi "ok"; then
            # 2026-09-15/16: every run said "re-mint the token" while the
            # CLI's own line was "You've hit your weekly limit". A usage
            # limit is not an auth failure; say which one it is.
            if printf '%s' "$out" | grep -qiE "hit your .*limit|usage limit|rate limit"; then
              echo "::error::Claude usage limit reached; the token is fine, do not re-mint. $(printf '%s' "$out" | grep -iE 'limit' | head -1)"
            else
              echo "::error::Claude auth failed (exit $rc) — re-mint with \
          'claude setup-token' and update CLAUDE_CODE_OAUTH_TOKEN."
            fi
            printf '%s\n' "$out" | tail -5
            exit 1
          fi

      - name: Read the documents
        if: steps.unread.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DRY: ${{ inputs.dry_run || '0' }}
          WORKERS: ${{ inputs.workers || '3' }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -u
          # One reader per document, several at a time. The reading steps are
          # in scripts/pilot_read_one.sh (the loop that was here until
          # 2026-11-25, moved unchanged). Each document is committed as it
          # finishes, so a cancelled run costs the documents in flight.
          git -C pilot-data config user.name  'pilot-reader-bot'
          git -C pilot-data config user.email 'actions@users.noreply.github.com'
          python scripts/pilot_read.py --unread /tmp/unread.json \
            --root "pilot-data/$PILOT_ROOT" --workers "$WORKERS" \
            --budget-minutes 75 --dry-run "$DRY"

      - name: Record a quiet run in ops
        if: steps.unread.outputs.count == '0'
        run: |
          # A run that found nothing still writes its ops entry: both
          # commits used to sit behind the same non-zero gate, so a day
          # the readers produced nothing left no trace to diagnose.
          python scripts/pilot_ops_record.py --root "pilot-data/$PILOT_ROOT" \
            --total 0 --failed 0 --quiet-run

      - name: Commit ops for a quiet run
        if: steps.unread.outputs.count == '0'
        working-directory: pilot-data
        run: |
          git config user.name "pilot-reader-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -d "$PILOT_ROOT/ops" ] && git add "$PILOT_ROOT/ops/"
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "pilot: reader quiet run ($(date -u +%FT%TZ))"
          git pull --rebase --quiet origin pilot-data || true
          git push origin pilot-data

      - name: Commit cards
        if: steps.unread.outputs.count != '0'
        working-directory: pilot-data
        run: |
          git config user.name "pilot-reader-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -d "$PILOT_ROOT/cards" ]; then
            git add "$PILOT_ROOT/cards/"
          fi
          if [ -d "$PILOT_ROOT/ops" ]; then
            git add "$PILOT_ROOT/ops/"
          fi
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "pilot: reader cards ($(date -u +%FT%TZ))"
          # The publish job also pushes here; rebase before push so a
          # concurrent commit is a retry, not a lost run.
          git pull --rebase --quiet origin pilot-data || true
          git push origin pilot-data
