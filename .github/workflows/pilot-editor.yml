# Shadow editor — one write per trading day from the pilot ledger.
#
# 13:55 UTC Mon-Fri (plan 3.5): after the 13:15 catch-up read, before
# production's 14:00 fire, so both arms see the same information
# window. Records unread_source_files_at_edit (plan 3.6) so a late PDF
# production covered and the shadow missed reads as a coverage
# artifact, not a quality gap. Never touches Discord or pulse-data.
#
# Model pinned via scripts/pilot_config.py MODEL_EDITOR (plan 3.7);
# provenance rides in shadow/<date>.meta.json.
name: pilot-editor

# No `schedule:` block. The worker dispatches this at 13:55 UTC
# (PILOT_DISPATCH_ENABLED). GitHub's cron fallback fired at 17:11-17:19
# on 2026-09-03 and 2026-09-04 and overwrote the 13:55 shadow pulse with
# one written from three more hours of cards, after production had
# published, and the graders graded the late version (2026-09-05).
on:
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to edit (YYYY-MM-DD, default today)"
        required: false
      days:
        description: "day-directories to pack (default 1)"
        required: false
      stress:
        description: "true = plan 4.3 stress datapoint: merged pack, --allow-stale, written to pilot/stress/, never to shadow/"
        required: false

permissions:
  contents: write

concurrency:
  group: pilot-editor
  cancel-in-progress: false

env:
  PILOT_ROOT: pilot
  PILOT_BRANCH: pilot-data

jobs:
  edit:
    runs-on: ubuntu-latest
    # 30 until 2026-09-16; the wait step below can hold for 40.
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout pilot-data
        uses: actions/checkout@v4
        with:
          ref: pilot-data
          path: pilot-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Five of thirteen shakedown days were VOID because this job ran
      # on the clock while readers were still committing cards
      # (2026-09-16 review). The edit is condition-triggered now: wait,
      # re-pulling pilot-data, until nothing is unread or 40 minutes
      # pass. A day that still has unread files after that is recorded
      # as before (unread_source_files_at_edit) and stays void; the
      # wait only converts days the readers would have finished anyway.
      - name: Wait for the readers
        if: github.event.inputs.stress != 'true'
        run: |
          for i in $(seq 1 20); do
            python scripts/pilot_list_unread.py \
              --root "pilot-data/$PILOT_ROOT" --out /tmp/unread.json \
              --given-up-out /tmp/given_up.json
            UNREAD=$(python -c "import json;print(len(json.load(open('/tmp/unread.json'))))")
            echo "unread: $UNREAD (check $i/20)"
            [ "$UNREAD" -eq 0 ] && break
            sleep 120
            git -C pilot-data pull --quiet --ff-only origin pilot-data || true
          done

      - name: Build the editor pack
        id: pack
        run: |
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(date -u +%F)
          DAYS="${{ github.event.inputs.days }}"
          [ -z "$DAYS" ] && DAYS=1
          echo "EDIT_DATE=$DATE" >> "$GITHUB_ENV"
          # Plan 4.3 stress datapoint (2026-09-17): the same editor over
          # a merged multi-day pack, written beside the pilot tree, not in
          # it. The graders read shadow/<date>.md only, so a stress
          # artifact can never be graded or change a verdict.
          STALE=""
          if [ "${{ github.event.inputs.stress }}" = "true" ]; then
            STALE="--allow-stale"
            echo "EDIT_OUTDIR=pilot-data/$PILOT_ROOT/stress" >> "$GITHUB_ENV"
            echo "EDIT_STEM=$DATE-${DAYS}d" >> "$GITHUB_ENV"
          else
            echo "EDIT_OUTDIR=pilot-data/$PILOT_ROOT/shadow" >> "$GITHUB_ENV"
            echo "EDIT_STEM=$DATE" >> "$GITHUB_ENV"
          fi
          mkdir -p /tmp/ed
          python scripts/pilot_list_unread.py \
            --root "pilot-data/$PILOT_ROOT" --out /tmp/ed/unread.json \
            --given-up-out /tmp/ed/given_up.json
          UNREAD=$(python -c "import json;print(len(json.load(open('/tmp/ed/unread.json'))))")
          GIVEN_UP=$(python -c "import json;print(len(json.load(open('/tmp/ed/given_up.json'))))")
          echo "UNREAD_AT_EDIT=$UNREAD" >> "$GITHUB_ENV"
          echo "GIVEN_UP_AT_EDIT=$GIVEN_UP" >> "$GITHUB_ENV"
          # The packer exits 2 when the edit date has no cards of its
          # own: the readers did not run, and editing anyway writes
          # today's pulse from an earlier day's cards, which is exactly
          # what happened on 2026-09-03. Fail LOUD and publish nothing.
          set +e
          python scripts/pilot_editor_pack.py "pilot-data/$PILOT_ROOT/cards" \
            --date "$DATE" --days "$DAYS" $STALE --out /tmp/ed/pack
          PACK_RC=$?
          set -e
          if [ "$PACK_RC" -eq 2 ]; then
            echo "cards=0" >> "$GITHUB_OUTPUT"
            echo "::error::No reader cards for $DATE: the readers did not run or produced nothing ($UNREAD unread). Refusing to edit from an earlier day's cards; no shadow pulse published."
            exit 1
          fi
          if [ "$PACK_RC" -ne 0 ]; then
            echo "::error::editor pack failed (exit $PACK_RC)"; exit "$PACK_RC"
          fi
          N=$(python -c "import json;print(json.load(open('/tmp/ed/pack.json'))['card_count'])")
          echo "cards=$N" >> "$GITHUB_OUTPUT"
          echo "unread at edit: $UNREAD; given up: $GIVEN_UP; cards in window: $N"

      - name: Install Claude Code
        if: steps.pack.outputs.cards != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Auth check
        if: steps.pack.outputs.cards != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          out=$(claude -p "reply with exactly: ok" --model haiku --max-turns 1 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ] || ! printf '%s' "$out" | grep -qi "ok"; then
            # A usage limit is not an auth failure (2026-09-15/16).
            if printf '%s' "$out" | grep -qiE "hit your .*limit|usage limit|rate limit"; then
              echo "::error::Claude usage limit reached; the token is fine, do not re-mint. $(printf '%s' "$out" | grep -iE 'limit' | head -1)"
            else
              echo "::error::Claude auth failed (exit $rc) — re-mint with 'claude setup-token'."
            fi
            printf '%s\n' "$out" | tail -5
            exit 1
          fi

      - name: Write the shadow pulse
        if: steps.pack.outputs.cards != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -u
          MODEL=$(python -c "from scripts.pilot_config import MODEL_EDITOR;print(MODEL_EDITOR)")
          OUTDIR="$EDIT_OUTDIR"
          mkdir -p "$OUTDIR"
          python scripts/pilot_editor_prompt.py /tmp/ed/pack.md --out /tmp/ed/prompt.txt
          # Prompt on stdin: the pack can exceed the kernel's per-argument
          # limit on a heavy day or a merged stress run (review 2026-09-01).
          claude -p --model "$MODEL" \
            --permission-mode bypassPermissions --max-turns 6 \
            < /tmp/ed/prompt.txt > /tmp/ed/raw.md 2>/tmp/ed/err.txt || true
          python scripts/pilot_finalize_edit.py --raw /tmp/ed/raw.md \
            --out "$OUTDIR/$EDIT_STEM.md" --meta "$OUTDIR/$EDIT_STEM.meta.json" \
            --model "$MODEL" --unread "$UNREAD_AT_EDIT" --given-up "$GIVEN_UP_AT_EDIT" \
            --prompt docs/superpowers/routines/pilot/editor.md \
            --pack /tmp/ed/pack.json
          # Pass 1: verify citations; one in-session re-ask on failures.
          set +e
          python scripts/pilot_verify_citations.py "$OUTDIR/$EDIT_STEM.md" /tmp/ed/pack.json \
            --meta-out "$OUTDIR/$EDIT_STEM.meta.json" --reask-out /tmp/ed/reask.json
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            {
              cat /tmp/ed/prompt.txt
              printf '\n[RE-ASK] These sentences failed citation verification:\n'
              cat /tmp/ed/reask.json
              printf '\nRe-emit the COMPLETE pulse. For each failed sentence, cite the card that actually carries the figure or bank, or remove the figure. Change nothing else.\n'
            } > /tmp/ed/reask_prompt.txt
            claude -p --model "$MODEL" \
              --permission-mode bypassPermissions --max-turns 6 \
              < /tmp/ed/reask_prompt.txt > /tmp/ed/raw.md 2>/dev/null || true
            python scripts/pilot_finalize_edit.py --raw /tmp/ed/raw.md \
              --out "$OUTDIR/$EDIT_STEM.md" --meta "$OUTDIR/$EDIT_STEM.meta.json" \
              --model "$MODEL" --unread "$UNREAD_AT_EDIT" --given-up "$GIVEN_UP_AT_EDIT" \
              --prompt docs/superpowers/routines/pilot/editor.md \
              --pack /tmp/ed/pack.json --reasked || true
          fi
          # Pass 2: record whatever remains; a failed citation is a grade
          # input, not a blocker. Belt and braces on the exit code: the
          # verifier no longer returns 1 on --final, and this must not
          # abort the step even if a future check does, because the commit
          # below is skipped when this step fails and the day's pulse is
          # then written to disk and discarded (2026-09-03).
          set +e
          python scripts/pilot_verify_citations.py "$OUTDIR/$EDIT_STEM.md" /tmp/ed/pack.json \
            --meta-out "$OUTDIR/$EDIT_STEM.meta.json" \
            --stripped-out "$OUTDIR/$EDIT_STEM.clean.md" --final
          echo "pass 2 verifier exit: $?"
          set -e

      - name: Commit shadow pulse
        if: steps.pack.outputs.cards != '0'
        working-directory: pilot-data
        run: |
          git config user.name "pilot-editor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$PILOT_ROOT/shadow/" "$PILOT_ROOT/stress/"
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "pilot: ${EDIT_OUTDIR##*/} pulse $EDIT_STEM"
          git pull --rebase --quiet origin pilot-data || true
          git push origin pilot-data
