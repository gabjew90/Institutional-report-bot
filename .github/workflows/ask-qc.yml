# Daily QC — headless Claude Code, 8 AM Pacific, two phases:
# phase 1 grades yesterday's /ask log (cross-family), phase 2
# reviews TODAY's published pulse (fresh-context). One auth,
# one commit.
#
# Grades yesterday's /ask interactions (Gemini answers, Claude judge)
# and triages every FAIL by actually running the validator classes.
# Runs in PARALLEL with the worker's 07:00 UTC Gemini QC job for a
# comparison week; this one writes ask-qc/<date>.claude.md so the two
# never collide.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN repo secret (from `claude setup-token`,
# billed to the Max subscription — no API key anywhere). The token
# lives ~a year; the auth-check step below fails LOUDLY when it dies
# so the job never rots silently.
name: daily-qc

on:
  schedule:
    - cron: "0 15 * * *"    # 8:00 AM Pacific (owner call 2026-08-28).
                            # GitHub cron is UTC-fixed: this is 8 AM
                            # during PDT and drifts to 7 AM in winter
                            # PST. The graded day (yesterday UTC)
                            # closed 15h earlier either way.
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to grade (YYYY-MM-DD, default yesterday)"
        required: false

permissions:
  contents: write

concurrency:
  group: ask-qc
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout pulse-data
        uses: actions/checkout@v4
        with:
          ref: pulse-data
          path: pulse-data

      - name: Resolve date and check the log exists
        id: date
        run: |
          QC_DATE="${{ github.event.inputs.date }}"
          if [ -z "$QC_DATE" ]; then
            QC_DATE=$(date -u -d "yesterday" +%F)
          fi
          echo "QC_DATE=$QC_DATE" >> "$GITHUB_ENV"
          if [ ! -f "pulse-data/ask-logs/$QC_DATE.md" ]; then
            echo "no ask-log for $QC_DATE — nothing to grade"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Auth check (fail loudly, not silently)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is missing."
            exit 1
          fi
          # Exit code FIRST, then content. The first version piped
          # into grep, and a 401 (stderr, pipeline exit swallowed)
          # sailed through the gate whose only job was catching it.
          set +e
          out=$(claude -p "reply with exactly: ok" --model haiku \
              --max-turns 1 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ] || ! printf '%s' "$out" | grep -qi "ok"; then
            echo "::error::Claude auth failed (exit $rc) — the token is \
          invalid or expired. Re-mint with 'claude setup-token' and \
          update the CLAUDE_CODE_OAUTH_TOKEN repo secret (Name exactly \
          that; the token goes in the Value box)."
            printf '%s\n' "$out" | tail -5
            exit 1
          fi

      - name: Wait for today's pulse artifacts
        id: pulse
        run: |
          # Runs BEFORE the ask grade so the pull-loop touches a
          # PRISTINE tree — phase 1 writes uncommitted files into
          # pulse-data/, and pulling after that invites merge
          # collisions with the publisher's 30-min commits.
          # The pulse publishes ~7:00-7:45 AM Pacific; this job runs at
          # 8:00. A slow re-rolled run can still be finishing, so wait
          # up to 20 minutes for today's driver artifact before grading
          # -- and if it NEVER lands, fail loudly: a missing pulse at
          # 8:20 AM is exactly the kind of thing this job should page
          # about. Weekends/holidays have no pulse; skip quietly.
          TODAY=$(date -u +%F)
          DOW=$(date -u +%u)
          if [ "$DOW" -gt 5 ]; then
            echo "weekend — no pulse to grade"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for i in $(seq 1 21); do
            cd pulse-data && git pull --quiet origin pulse-data && cd ..
            TS=$(ls pulse-data/pulse-output/driver/ 2>/dev/null                  | grep "^$TODAY" | sort | tail -1)
            if [ -n "$TS" ]; then
              echo "QC_PULSE_TS=${TS%.json}" >> "$GITHUB_ENV"
              echo "found pulse run ${TS%.json}"
              exit 0
            fi
            echo "no pulse artifact for $TODAY yet (poll $i/21)"
            sleep 60
          done
          # A holiday skip is legitimate -- the driver records
          # SKIP_PULSE but commits nothing, so distinguish by day: if
          # no artifact after the wait on a weekday, alert.
          echo "::error::no pulse driver artifact for $TODAY by 8:20 AM           Pacific — the pulse is late or failed. Check the routine."
          exit 1

      - name: Grade and triage
        if: steps.date.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat docs/superpowers/routines/ask-qc-headless.md)" \
            --model sonnet \
            --permission-mode bypassPermissions \
            --max-turns 80 \
            2>&1 | tee qc_run.log
          grep -q "^QC RESULT:" qc_run.log || {
            echo "::error::judge finished without the QC RESULT line — \
          treating as a failed run (an erroring gate is a failed gate)";
            exit 1; }

      - name: Verify ask outputs exist
        if: steps.date.outputs.skip != 'true'
        run: |
          test -f "pulse-data/ask-qc/$QC_DATE.claude.md" || {
            echo "::error::report file missing"; exit 1; }
          test -f "pulse-data/ask-qc/findings-queue.md" || {
            echo "::error::findings queue missing"; exit 1; }

      - name: Grade today's pulse
        if: steps.pulse.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat docs/superpowers/routines/pulse-qc-headless.md)"             --model sonnet             --permission-mode bypassPermissions             --max-turns 60             2>&1 | tee pulse_qc_run.log
          grep -q "^PULSE QC RESULT:" pulse_qc_run.log || {
            echo "::error::pulse judge finished without its result line           — treating as a failed run";
            exit 1; }
          test -f "pulse-data/pulse-output/qc-headless/$QC_PULSE_TS.md" || {
            echo "::error::pulse report file missing"; exit 1; }

      - name: Commit to pulse-data
        if: steps.date.outputs.skip != 'true' || steps.pulse.outputs.skip != 'true'
        working-directory: pulse-data
        run: |
          git config user.name "ask-qc-bot"
          git config user.email "actions@users.noreply.github.com"
          # Add each path only if it exists: on weekends the pulse
          # phase skips and pulse-output/qc-headless/ is never created,
          # and an unconditional git add on a missing pathspec is
          # FATAL — the first Saturday run discarded a perfectly good
          # ask-phase grading over it (2026-08-29).
          git add ask-qc/
          if [ -d pulse-output/qc-headless ]; then
            git add pulse-output/qc-headless/
          fi
          if [ -f pulse-output/findings-queue.md ]; then
            git add pulse-output/findings-queue.md
          fi
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "daily-qc: claude judge $QC_DATE (+pulse $QC_PULSE_TS)"
          git push origin pulse-data
