# Tests on every push to the deploy branch (2026-11-23, owner).
#
# The only check before a deploy used to be the pre-push hook on the
# machine doing the push. It ran the working copy, not the commit, it
# did not run the test suite, and a session could skip it. Recorded
# failures it let through: two pushes on a failed gate (2026-09-01), a
# 19-hour outage from one untested line, and a commit that left half of
# a change behind.
#
# This run tests the COMMITTED tree on the worker's Python. With
# Railway's "Wait for CI" setting on, a red run means the deploy is
# skipped and production keeps the previous version. Railway reads the
# conclusion of every workflow run on the commit, so nothing else may
# trigger on push to the deploy branch without the owner knowing that.
#
# `ci/**` branches run the same job without deploying: use one to try a
# change to this file or to the test setup.
name: ci

on:
  push:
    branches:
      - claude/financial-pdf-discord-bot-mDpbk
      - "ci/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12 (the worker's version)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the pinned requirements
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test suite
        run: python -m pytest tests -q -p no:cacheprovider -W ignore

      - name: Fast smoke tier
        # The classic pulse for the smokes, as the push gate sets it. Not
        # for the test step: the Omnipulse tests need the switch on.
        env:
          OMNIPULSE_BODY: "off"
        run: python scripts/run_smokes.py
