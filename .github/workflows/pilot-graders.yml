# Pilot graders — two fresh agents per dimension, frozen prompts.
#
# 17:00 UTC Mon-Fri, after production has published and the shadow
# pulse exists. Grades both arms per artifact against the source text
# (spec section 8: no head-to-head voting, the artifacts cannot be
# blinded). The production pulse comes from pulse-data's archive; the
# pilot tree on pilot-data is never written by production.
#
# Prompts under docs/superpowers/routines/pilot/graders/ are FROZEN
# from day 1: a change restarts the clock (plan 3.7) and re-runs the
# separation gate (pilot-grader-gate.yml).
name: pilot-graders

on:
  schedule:
    - cron: "0 17 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to grade (YYYY-MM-DD, default today)"
        required: false

permissions:
  contents: write

concurrency:
  group: pilot-graders
  cancel-in-progress: false

env:
  PILOT_ROOT: pilot
  PILOT_BRANCH: pilot-data

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout pilot-data
        uses: actions/checkout@v4
        with:
          ref: pilot-data
          path: pilot-data

      - name: Checkout pulse-data (production archive, read-only here)
        uses: actions/checkout@v4
        with:
          ref: pulse-data
          path: pulse-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the day's artifacts
        id: day
        run: |
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(date -u +%F)
          echo "GRADE_DATE=$DATE" >> "$GITHUB_ENV"
          SHADOW="pilot-data/$PILOT_ROOT/shadow/$DATE.md"
          PROD=$(ls pulse-data/pulse-output/archive/ 2>/dev/null | grep "^$DATE" | grep -E "\.md$" | sort | tail -1)
          if [ ! -f "$SHADOW" ]; then
            echo "no shadow pulse for $DATE; nothing to grade"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$PROD" ]; then
            echo "no production archive pulse for $DATE; nothing to grade"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "PROD_MD=pulse-data/pulse-output/archive/$PROD" >> "$GITHUB_ENV"
          mkdir -p /tmp/gr
          python scripts/pilot_editor_pack.py "pilot-data/$PILOT_ROOT/cards" \
            --date "$DATE" --days 1 --out /tmp/gr/pack
          python scripts/pilot_grader_inputs.py --pilot-root "pilot-data/$PILOT_ROOT" \
            --date "$DATE" --production-md "pulse-data/pulse-output/archive/$PROD" \
            --pack-json /tmp/gr/pack.json --out-dir /tmp/gr/in
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.day.outputs.skip == 'false'
        run: npm install -g @anthropic-ai/claude-code

      - name: Auth check
        if: steps.day.outputs.skip == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          out=$(claude -p "reply with exactly: ok" --model haiku --max-turns 1 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ] || ! printf '%s' "$out" | grep -qi "ok"; then
            echo "::error::Claude auth failed (exit $rc)"; exit 1
          fi

      - name: Grade every dimension, two agents each
        if: steps.day.outputs.skip == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -u
          MODEL=$(python -c "from scripts.pilot_config import MODEL_GRADER;print(MODEL_GRADER)")
          OUT="pilot-data/$PILOT_ROOT/grades/$GRADE_DATE"
          mkdir -p "$OUT"
          P=docs/superpowers/routines/pilot/graders
          run_one () {  # dim prompt input artifact agent
            DIM="$1"; PROMPT="$2"; INPUT="$3"; ART="$4"; AG="$5"
            NAME="$DIM"; [ -n "$ART" ] && NAME="$DIM-$ART"
            if [ "$DIM" = "brief_fidelity" ] && [ -f /tmp/gr/in/brief_fidelity.SKIP ]; then
              echo "skip brief_fidelity: no briefs in the window"; return 0
            fi
            { cat "$PROMPT"; printf '\n\n---\n\n'; cat "$INPUT"; } > /tmp/gr/prompt.txt
            # Prompt on stdin, not as an argument: a source-heavy input can
            # exceed the kernel's per-argument limit (review 2026-09-01).
            # 60 turns: tracing 15 sentences through nine source files
            # exhausted 30 on shakedown day 1 (2026-09-02).
            claude -p --model "$MODEL" \
              --permission-mode bypassPermissions --max-turns 60 \
              < /tmp/gr/prompt.txt > /tmp/gr/raw.txt 2>/dev/null || true
            python scripts/pilot_finalize_grade.py --raw /tmp/gr/raw.txt \
              --out "$OUT/$NAME-$AG.json" --dim "$DIM" --agent "$AG" \
              --model "$MODEL" --prompt "$PROMPT" --artifact "$ART" || true
          }
          for AG in a b; do
            run_one grouping        $P/grouping.md        /tmp/gr/in/grouping.md            ""          $AG
            run_one fidelity        $P/fidelity.md        /tmp/gr/in/fidelity-shadow.md     shadow      $AG
            run_one fidelity        $P/fidelity.md        /tmp/gr/in/fidelity-production.md production  $AG
            run_one brief_fidelity  $P/brief_fidelity.md  /tmp/gr/in/brief_fidelity.md      ""          $AG
            run_one mechanism       $P/mechanism.md       /tmp/gr/in/mechanism-shadow.md    shadow      $AG
            run_one mechanism       $P/mechanism.md       /tmp/gr/in/mechanism-production.md production $AG
          done
          ls "$OUT"

      - name: Scoreboard
        if: steps.day.outputs.skip == 'false'
        run: |
          python scripts/pilot_scoreboard.py --pilot-root "pilot-data/$PILOT_ROOT"

      - name: Commit grades and scoreboard
        if: steps.day.outputs.skip == 'false'
        working-directory: pilot-data
        run: |
          git config user.name "pilot-grader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$PILOT_ROOT/grades/" "$PILOT_ROOT/scoreboard.md"
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "pilot: grades $GRADE_DATE"
          git pull --rebase --quiet origin pilot-data || true
          git push origin pilot-data
