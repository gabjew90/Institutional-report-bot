[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "institutional-report-bot"
version = "0.1.0"
description = "Analyzes institutional financial research PDFs and delivers Market Pulse reports via Discord"
# Pinned to the container runtime (see .python-version and
# scripts/preflight_push.py CONTAINER_PYTHON). The upper bound is
# deliberate: on 3.13 the stdlib `audioop` module is REMOVED and
# discord.py imports it directly, so an unpinned base-image bump
# would crash the bot on import. Moving this bound is a deliberate
# act that must come with audioop-lts (already declared below).
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=1.0.0",
    "discord.py>=2.4.0",
    "dropbox>=12.0.0",
    "PyMuPDF>=1.25.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "APScheduler>=3.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
]

[tool.setuptools.packages.find]
include = [
    "dropbox_client*",
    "pdf_processing*",
    "ai_analysis*",
    "report*",
    "discord_bot*",
    "scheduler*",
    "pipeline*",
]
