[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "institutional-report-bot"
version = "0.1.0"
description = "Analyzes institutional financial research PDFs and delivers Market Pulse reports via Discord"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "discord.py>=2.4.0",
    "dropbox>=12.0.0",
    "PyMuPDF>=1.25.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "APScheduler>=3.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
]

[tool.setuptools.packages.find]
include = [
    "dropbox_client*",
    "pdf_processing*",
    "ai_analysis*",
    "report*",
    "discord_bot*",
    "scheduler*",
    "pipeline*",
]
